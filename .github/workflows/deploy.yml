name: Deploy to server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /home/eliott/ProjetLanWOW
          git pull origin master
          rsync -a --delete \
            --exclude='.git' \
            --exclude='discord-bot/node_modules' \
            --exclude='api/node_modules' \
            --exclude='api/data' \
            --exclude='wow-assets/mo3/900914.mo3' \
            --exclude='wow-assets/mo3/974343.mo3' \
            --exclude='wow-assets/mo3/7760205.mo3' \
            --exclude='wow-assets/mo3/7760285.mo3' \
            /home/eliott/ProjetLanWOW/ /home/eliott/monsite/
          TS=$(date +%s)
          sed -i "s/__CACHE_BUST__/$TS/g" /home/eliott/monsite/js/layout.js
          cp /home/eliott/monsite/nginx/default.conf /home/eliott/nginx-lan.conf
          pm2 restart lan-api
          docker exec monsite nginx -s reload
          echo "✅ Deploy OK (v=$TS)"
