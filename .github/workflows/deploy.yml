name: Deploy to server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /home/eliott/ProjetLanWOW
          git pull origin master
          rsync -a --delete \
            --exclude='.git' \
            --exclude='discord-bot/node_modules' \
            --exclude='api/node_modules' \
            --exclude='api/data' \
            /home/eliott/ProjetLanWOW/ /home/eliott/monsite/
          docker exec monsite nginx -s reload
          echo "✅ Deploy OK"
