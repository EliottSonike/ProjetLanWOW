name: Fetch WoW 3D Assets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download mo3 files from wotlk5.com
        run: |
          mkdir -p wow-mo3
          BASE="https://wotlk5.com/armory/data/mo3"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          # Métadonnées wotlk5.com (différentes de zamimg.com)
          mkdir -p wow-mo3/meta/character
          curl -fsSL -A "$UA" -H "Referer: https://wotlk5.com/" \
            -o "wow-mo3/meta/character/7.json" \
            "https://wotlk5.com/armory/data/meta/character/7.json" \
            && echo "✅ meta/character/7.json ($(stat -c%s wow-mo3/meta/character/7.json) bytes)" \
            || echo "❌ meta/character/7.json introuvable"

          # Modèles mo3
          for ID in 147530 900914 974343 7760205 7760285 120791 119159; do
            curl -fsSL -L \
              -A "$UA" \
              -H "Referer: https://wotlk5.com/" \
              -H "Cookie: cookieConsent=true" \
              -o "wow-mo3/$ID.mo3" "$BASE/$ID.mo3" \
              && echo "✅ $ID.mo3 ($(stat -c%s wow-mo3/$ID.mo3) bytes)" \
              || echo "❌ $ID.mo3 introuvable"
          done
          ls -lh wow-mo3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-mo3-files
          path: wow-mo3/
          retention-days: 1

  deploy:
    needs: download
    runs-on: self-hosted
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wow-mo3-files
          path: /tmp/wow-mo3/

      - name: Copy to server
        run: |
          mkdir -p /home/eliott/monsite/wow-assets/mo3
          mkdir -p /home/eliott/monsite/wow-assets/meta/character

          # Métadonnées
          if [ -f /tmp/wow-mo3/meta/character/7.json ]; then
            cp /tmp/wow-mo3/meta/character/7.json /home/eliott/monsite/wow-assets/meta/character/
            echo "✅ meta/character/7.json"
          fi

          # Modèles mo3
          for f in /tmp/wow-mo3/*.mo3; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 10000 ]; then
              cp "$f" /home/eliott/monsite/wow-assets/mo3/
              echo "✅ $(basename $f) ($SIZE bytes)"
            else
              echo "⚠️ $(basename $f) trop petit ($SIZE bytes) — ignoré"
            fi
          done
          ls -lh /home/eliott/monsite/wow-assets/mo3/
          echo "✅ Assets 3D en place"
