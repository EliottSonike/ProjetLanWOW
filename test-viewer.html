<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Viewer — Krapule WebP Fix</title>
  <style>
    body { background: #0a0a14; color: #c8a96e; font-family: monospace; padding: 20px; }
    #viewer { width: 400px; height: 500px; margin: 20px auto; border: 1px solid #3a3a5a; }
    #log { background: #111; padding: 10px; font-size: 12px; max-height: 250px; overflow: auto; margin-top: 10px; }
    h2 { color: #f0c060; text-align: center; }
  </style>
</head>
<body>
<h2>🧙 Test Viewer — Krapule (WebP textures fix)</h2>
<div id="viewer"></div>
<div id="log">Initialisation...</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
// PATCH RAF — log les erreurs pour diagnostic
(function(){
  var _raf = window.requestAnimationFrame;
  var _errCnt = 0;
  window.requestAnimationFrame = function(cb) {
    return _raf.call(window, function(t) {
      try { cb(t); }
      catch(e) {
        if(_errCnt++ < 5) {
          console.warn('[RAF ERROR #'+_errCnt+']', e.message, e.stack ? e.stack.split('\n')[1] : '');
        }
      }
    });
  };
  console.log('[RAF PATCH] actif ✅');
})();
</script>
<script src="/wow-assets/viewer/viewer.min.js"></script>
<script>
const log = document.getElementById('log');
function L(msg, color) {
  const d = document.createElement('div');
  d.style.color = color || '#c8a96e';
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  console.log(msg);
}

// XHR — log requête + réponse avec status
const _xhrOpen = XMLHttpRequest.prototype.open;
const _xhrSend = XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open = function(method, url) {
  this._wowUrl = (url||'').includes('/wow-assets/') ? url : null;
  return _xhrOpen.apply(this, arguments);
};
XMLHttpRequest.prototype.send = function() {
  if (this._wowUrl) {
    const s = this._wowUrl.replace('https://lansduswag.site','').substring(0,80);
    L('XHR→ ' + s, '#88aaff');
    this.addEventListener('load', () => L('XHR '+(this.status===200?'✅':'❌')+' '+this.status+': '+s, this.status===200?'#4a9':'#e55'));
    this.addEventListener('error', () => L('XHR ❌ ERR: '+s, '#e55'));
  }
  return _xhrSend.apply(this, arguments);
};

// fetch() — intercepte les requêtes du viewer (bone files, textures, shaders)
const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  const u = (typeof url==='string'?url:(url&&url.url)||'');
  const s = u.replace('https://lansduswag.site','').substring(0,80);
  if(u.includes('wow-assets')||u.includes('zamimg')||u.includes('wotlk')) L('FETCH→ '+s,'#88aaff');
  return _origFetch.apply(this, arguments).then(r=>{
    if(u.includes('wow-assets')||u.includes('zamimg')||u.includes('wotlk'))
      L('FETCH '+(r.ok?'✅':'❌')+' '+r.status+': '+s, r.ok?'#4a9':'#e55');
    return r;
  }).catch(e=>{ L('FETCH ❌ '+e.message+': '+s,'#e55'); throw e; });
};

// Détecter création du canvas WebGL dans #viewer
new MutationObserver(muts => {
  for(const m of muts) for(const n of m.addedNodes) {
    if(n.tagName==='CANVAS') L('Canvas WebGL créé ✅ ('+n.width+'×'+n.height+')', '#4a9');
  }
}).observe(document.getElementById('viewer'), {childList:true, subtree:true});

// Stall detector — si rien après 5s
setTimeout(() => {
  const canvas = document.querySelector('#viewer canvas');
  if(!canvas) L('⚠️ STALL 5s: aucun canvas — WebGL init échoué?', '#e55');
  else L('Canvas présent '+canvas.width+'×'+canvas.height, '#fa0');
}, 5000);

// PATCH critique : WH.WebP pour les textures
window.CONTENT_PATH = '/wow-assets/';
window.WH = window.WH || {};
window.WH.debug = window.WH.debug || (() => {});

// La correction clé : WH.WebP.getImageExtension() → '.webp'
window.WH.WebP = {
  getImageExtension: function() { return '.webp'; },
  isSupported: function() { return true; }
};


L('WH.WebP patché ✅', '#4a9');
L('ZamModelViewer: ' + typeof ZamModelViewer, typeof ZamModelViewer !== 'undefined' ? '#4a9' : '#e55');

// customizationOptions réels de Krapule depuis wotlk5.com
const customOpts = [
  {"optionId":81,"choiceId":1188},
  {"optionId":80,"choiceId":1176},
  {"optionId":82,"choiceId":1200},
  {"optionId":83,"choiceId":1222},
  {"optionId":783,"choiceId":8762},
  {"optionId":84,"choiceId":1233},
  {"optionId":784,"choiceId":8766},
  {"optionId":548,"choiceId":6523}
];

try {
  const inst = new ZamModelViewer({
    type: ZamModelViewer.WOW,
    contentPath: '/wow-assets/',
    container: $('#viewer'),
    hd: true,
    aspect: 0.8,
    charCustomization: {
      race: 7,
      gender: 0,
      options: customOpts,
      sheathMain: -1,
      sheathOff: -1,
    },
    cls: 8,
    items: [],
    models: { type: ZamModelViewer.Wow.Types.CHARACTER, id: 13 },
  });
  L('ZamModelViewer créé ✅', '#4a9');
} catch(e) {
  L('ERREUR: ' + e.message, '#e55');
}
</script>
</body>
</html>
