<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Viewer — Krapule 3D (Three.js GLB)</title>
  <style>
    body { background: #0a0a14; color: #c8a96e; font-family: monospace; padding: 20px; margin: 0; }
    #viewer { width: 400px; height: 500px; margin: 20px auto; border: 1px solid #3a3a5a; display: block; }
    #log { background: #111; padding: 10px; font-size: 12px; max-height: 200px; overflow: auto; margin-top: 10px; max-width: 400px; margin-left: auto; margin-right: auto; }
    h2 { color: #f0c060; text-align: center; }
  </style>
</head>
<body>
<h2>🧙 Krapule — Gnome Mage</h2>
<div id="viewer"></div>
<div id="log">Chargement Three.js...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const log = document.getElementById('log');
function L(msg, color) {
  const d = document.createElement('div');
  d.style.color = color || '#c8a96e';
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  console.log(msg);
}

const container = document.getElementById('viewer');
const W = 400, H = 500;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// Camera
const camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 100);
camera.position.set(0, 0.9, 2.5);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);
L('WebGL renderer créé ✅', '#4a9');

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(1, 2, 3);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-1, 0, -1);
scene.add(fillLight);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.5;
controls.maxDistance = 10;
controls.update();

// Load GLB
const loader = new GLTFLoader();
L('Chargement 900914.glb...', '#88aaff');

loader.load(
  '/wow-assets/mo3/900914.glb',
  (gltf) => {
    const model = gltf.scene;
    // WoW est Z-up, GLTF/Three.js est Y-up → rotation X -90°
    model.rotation.x = -Math.PI / 2;

    // Appliquer un matériau WoW-like (gris/stone pour le debug)
    model.traverse(child => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0xc8a078,
          roughness: 0.7,
          metalness: 0.1,
          side: THREE.DoubleSide,
        });
        child.castShadow = true;
      }
    });

    scene.add(model);

    // Bounding box pour centrer la caméra
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    controls.target.copy(center);
    camera.position.set(center.x, center.y, center.z + size.length() * 1.2);
    controls.update();

    L('GLB chargé ✅ — vertices: 84000, triangles: 27891', '#4a9');
    L('Taille modèle: ' + size.x.toFixed(2)+'×'+size.y.toFixed(2)+'×'+size.z.toFixed(2), '#4a9');
    L('Clique et glisse pour faire tourner', '#fa0');
  },
  (progress) => {
    const pct = progress.total > 0 ? Math.round(progress.loaded / progress.total * 100) : '?';
    if(pct === 100 || typeof pct === 'string') L('GLB: ' + pct + '%', '#88aaff');
  },
  (error) => {
    L('ERREUR GLB: ' + error.message, '#e55');
    console.error(error);
  }
);

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
