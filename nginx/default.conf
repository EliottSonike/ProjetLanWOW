server {
    listen 80;

    # Proxy API Express (^~ = priorité sur les regex)
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy assets Wowhead via bypass-cors-policies (ajoute CORS headers)
    location ^~ /wow-assets/ {
        proxy_pass http://host.docker.internal:2999/;
        proxy_set_header Host wow.zamimg.com;
        proxy_cache_bypass 1;
    }

    # JS et CSS statiques : no-cache pour forcer Cloudflare à revalider
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
