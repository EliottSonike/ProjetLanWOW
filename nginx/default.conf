server {
    listen 80;

    # Proxy API Express (^~ = priorité sur les regex)
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Métadonnées 3D viewer (meta/, viewer/) — zamimg.com
    location ^~ /wow-assets/meta/ {
        proxy_pass https://wow.zamimg.com/modelviewer/live/meta/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Modèles 3D (mo3/) — wotlk5.com héberge ses propres fichiers
    location ^~ /wow-assets/mo3/ {
        proxy_pass https://wotlk5.com/armory/data/mo3/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Autres assets 3D (textures, shaders…) — zamimg.com
    location ^~ /wow-assets/ {
        proxy_pass https://wow.zamimg.com/modelviewer/live/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # JS et CSS statiques : no-cache pour forcer Cloudflare à revalider
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
