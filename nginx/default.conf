server {
    listen 80;

    # ── Compression gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/html application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # Proxy API Express
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # viewer wotlk5 pré-patché — statique nginx (pas d'Express)
    location ^~ /wow-assets/viewer/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Modèles 3D mo3/glb — cache long (binaires immuables)
    location ^~ /wow-assets/mo3/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/octet-stream' always;
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip off;
        try_files $uri =404;
    }

    # Textures WebP — fichier local d'abord, puis CDN zamimg en fallback
    location ^~ /wow-assets/textures/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control "public, max-age=86400";
        gzip off;
        try_files $uri @zamimg_textures;
    }
    location @zamimg_textures {
        rewrite ^/wow-assets/textures/(.*)$ /modelviewer/live/textures/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Métadonnées — fichiers locaux d'abord, puis CDN zamimg en fallback
    location ^~ /wow-assets/meta/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/json' always;
        try_files $uri @zamimg_meta;
    }
    location @zamimg_meta {
        rewrite ^/wow-assets/(.*)$ /modelviewer/classic/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # CDN wotlk5.com — modèles/textures WotLK (viewer principal)
    location ^~ /wow-assets-wotlk5/ {
        rewrite ^/wow-assets-wotlk5/(.*)$ /armory/data/$1 break;
        proxy_pass https://wotlk5.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wotlk5.com;
        proxy_set_header Referer "https://wotlk5.com/";
        proxy_set_header Origin "";
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Autres assets 3D — classic CDN (fallback)
    location ^~ /wow-assets/ {
        rewrite ^/wow-assets/(.*)$ /modelviewer/classic/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Images et assets statiques — cache long
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # JS et CSS : no-cache (déployés souvent, on veut toujours la version fraîche)
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
