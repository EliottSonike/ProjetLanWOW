server {
    listen 80;

    # Proxy API Express
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # viewer.min.js patché via API Express
    location ^~ /wow-assets/viewer/ {
        proxy_pass http://host.docker.internal:3001/wow-assets/viewer/;
        proxy_set_header Host $host;
    }

    # Modèles 3D mo3 — fichiers locaux (bounding box patchée côté viewer.min.js)
    location ^~ /wow-assets/mo3/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/octet-stream' always;
        gzip off;
        try_files $uri =404;
    }

    # Textures WebP — fichier local d'abord, puis CDN zamimg en fallback
    location ^~ /wow-assets/textures/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        gzip off;
        try_files $uri @zamimg_textures;
    }
    location @zamimg_textures {
        rewrite ^/wow-assets/textures/(.*)$ /modelviewer/live/textures/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Fichiers bone/skeleton — live CDN (200 OK confirmé)
    location ^~ /wow-assets/bone/ {
        rewrite ^/wow-assets/bone/(.*)$ /modelviewer/live/bone/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Métadonnées — fichiers locaux d'abord, puis CDN zamimg en fallback
    location ^~ /wow-assets/meta/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/json' always;
        try_files $uri @zamimg_meta;
    }
    location @zamimg_meta {
        rewrite ^/wow-assets/(.*)$ /modelviewer/classic/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Modèles live : viewer demande /mp3/ ou /mo3/ → on sert notre mo3 local patché (Express)
    location ^~ /wow-assets-live/mp3/ {
        rewrite ^/wow-assets-live/mp3/(.*)$ /wow-assets/mo3/$1 break;
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    location ^~ /wow-assets-live/mo3/ {
        rewrite ^/wow-assets-live/mo3/(.*)$ /wow-assets/mo3/$1 break;
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # CDN wotlk5.com pour les modèles/textures WotLK (légers, pas d'OOM)
    location ^~ /wow-assets-wotlk5/ {
        rewrite ^/wow-assets-wotlk5/(.*)$ /armory/data/$1 break;
        proxy_pass https://wotlk5.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wotlk5.com;
        proxy_set_header Referer "https://wotlk5.com/";
        proxy_set_header Origin "";
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Assets live zamimg (character type — textures retail composées)
    location ^~ /wow-assets-live/ {
        rewrite ^/wow-assets-live/(.*)$ /modelviewer/live/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # Autres assets 3D — classic CDN
    location ^~ /wow-assets/ {
        rewrite ^/wow-assets/(.*)$ /modelviewer/classic/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # JS et CSS statiques : no-cache
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
