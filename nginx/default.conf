server {
    listen 80;

    # Proxy API Express
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Modèles 3D mo3 — fichiers locaux (priorité sur le proxy)
    location ^~ /wow-assets/mo3/ {
        root /usr/share/nginx/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/octet-stream' always;
        gzip off;
        try_files $uri =404;
    }

    # Tous les autres assets 3D — proxy vers zamimg.com classic via rewrite
    location ^~ /wow-assets/ {
        rewrite ^/wow-assets/(.*)$ /modelviewer/classic/$1 break;
        proxy_pass https://wow.zamimg.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header Accept-Encoding "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_cache_bypass 1;
    }

    # JS et CSS statiques : no-cache
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
