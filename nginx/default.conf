server {
    listen 80;

    # Proxy API Express (^~ = priorité sur les regex)
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy assets 3D viewer — wotlk5.com héberge ses propres mo3/meta
    location ^~ /wow-assets/ {
        proxy_pass https://wotlk5.com/armory/data/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        proxy_cache_bypass 1;
    }

    # JS et CSS statiques : no-cache pour forcer Cloudflare à revalider
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Fichiers statiques
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
