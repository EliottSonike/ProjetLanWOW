<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 3D Viewer Custom — Krapule</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a14; color: #c8a96e; font-family: 'Segoe UI', sans-serif; }

    #app { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

    h1 { font-size: 1.4rem; color: #f0c060; margin-bottom: 16px; text-shadow: 0 0 20px rgba(240,192,96,0.5); }

    #viewer-wrap {
      position: relative;
      width: min(500px, 100%);
      height: 600px;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a14 100%);
      border: 1px solid #3a3a5a;
      border-radius: 8px;
      overflow: hidden;
    }

    #viewer-wrap canvas { display: block; }

    #drop-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      color: #888;
      font-size: 0.9rem;
      pointer-events: none;
    }
    #drop-overlay.hidden { display: none; }
    #drop-icon { font-size: 3rem; }

    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,20,0.8);
      font-size: 0.9rem; color: #c8a96e;
    }
    #loading.hidden { display: none; }

    #controls {
      display: flex; gap: 10px; margin-top: 12px;
      flex-wrap: wrap; justify-content: center;
    }
    button {
      background: #1e1e2e; border: 1px solid #3a3a5a;
      color: #c8a96e; padding: 8px 16px; border-radius: 4px;
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    button:hover { background: #2a2a4a; border-color: #c8a96e; }

    #file-input { display: none; }
    #info { margin-top: 10px; font-size: 0.8rem; color: #666; text-align: center; }

    #status {
      margin-top: 8px; font-size: 0.8rem; color: #4a9;
      min-height: 1.2em;
    }

    .anim-btn { background: #1a2a1a; border-color: #2a5a2a; }
    .anim-btn:hover { background: #2a4a2a; border-color: #4a9; color: #4a9; }
    .anim-btn.active { background: #2a4a2a; border-color: #4a9; color: #4a9; }
  </style>
</head>
<body>
<div id="app">
  <h1>⚔️ Viewer 3D Custom — Krapule</h1>

  <div id="viewer-wrap">
    <div id="drop-overlay">
      <div id="drop-icon">🧙</div>
      <div>Glisse un fichier <strong>.glb</strong> ou <strong>.gltf</strong> ici</div>
      <div style="font-size:0.75rem">Export avec <strong>wow.export</strong> depuis ton client WoW</div>
    </div>
    <div id="loading" class="hidden">⏳ Chargement…</div>
  </div>

  <div id="controls">
    <button onclick="document.getElementById('file-input').click()">📁 Ouvrir GLB/GLTF</button>
    <button onclick="loadDefault()">🔄 Tester modèle demo</button>
    <button onclick="resetCamera()">🎥 Reset caméra</button>
    <button onclick="toggleRotate()" id="rotate-btn">⏸ Stop rotation</button>
  </div>

  <div id="anim-controls" style="display:none; margin-top:8px;">
    <div style="font-size:0.8rem; color:#888; margin-bottom:6px;">Animations :</div>
    <div id="anim-btns" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center;"></div>
  </div>

  <input type="file" id="file-input" accept=".glb,.gltf">
  <div id="status"></div>
  <div id="info">
    Three.js custom viewer · Sans Wowhead/zamimg.com<br>
    Pour exporter ton perso : <strong>wow.export</strong> → Models → ton perso → Export GLTF
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const wrap = document.getElementById('viewer-wrap');
const dropOverlay = document.getElementById('drop-overlay');
const loading = document.getElementById('loading');
const status = document.getElementById('status');

// --- Scene setup ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.015);

const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.01, 100);
camera.position.set(0, 1.5, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1, 0);
controls.minDistance = 0.5;
controls.maxDistance = 10;

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x404060, 1.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffd090, 2);
dirLight.position.set(3, 5, 3);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x6090d0, 0.8);
fillLight.position.set(-3, 2, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffeedd, 0.5);
rimLight.position.set(0, 3, -4);
scene.add(rimLight);

// Particules d'ambiance
const particles = new THREE.BufferGeometry();
const pCount = 200;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 10;
particles.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x8866aa, size: 0.02, transparent: true, opacity: 0.6 });
scene.add(new THREE.Points(particles, pMat));

// Sol
const floorGeo = new THREE.CircleGeometry(2, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8, metalness: 0.2 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Anneau lumineux au sol
const ringGeo = new THREE.TorusGeometry(0.8, 0.02, 8, 64);
const ringMat = new THREE.MeshStandardMaterial({ color: 0x6040a0, emissive: 0x4020c0, emissiveIntensity: 1 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

// --- GLTF Loader ---
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

let currentModel = null;
let mixer = null;
let clock = new THREE.Clock();
let autoRotate = true;
let animations = [];

function setStatus(msg, color = '#4a9') {
  status.textContent = msg;
  status.style.color = color;
}

function clearModel() {
  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  document.getElementById('anim-controls').style.display = 'none';
  document.getElementById('anim-btns').innerHTML = '';
  animations = [];
}

function loadGLTF(url, name) {
  clearModel();
  loading.classList.remove('hidden');
  dropOverlay.classList.add('hidden');
  setStatus('Chargement ' + name + '…', '#c8a96e');

  gltfLoader.load(url, (gltf) => {
    loading.classList.add('hidden');

    const model = gltf.scene;
    currentModel = model;

    // Auto-scale
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 2 / maxDim;
      model.scale.setScalar(scale);
    }

    // Center at feet
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;
    model.position.x = 0;
    model.position.z = 0;

    // Enable shadows
    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.envMapIntensity = 1;
        }
      }
    });

    scene.add(model);

    // Camera target = center of model
    const finalBox = new THREE.Box3().setFromObject(model);
    const center = finalBox.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.set(center.x, center.y + 0.5, center.z + 2.5);
    controls.update();

    // Animations
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      animations = gltf.animations;
      setupAnimButtons();

      // Play first animation by default
      const action = mixer.clipAction(animations[0]);
      action.play();
      setStatus(`✅ ${name} — ${animations.length} animation(s)`, '#4a9');
    } else {
      setStatus(`✅ ${name} chargé (aucune animation)`, '#4a9');
    }

    URL.revokeObjectURL(url);
  }, (progress) => {
    if (progress.total) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      setStatus(`Chargement… ${pct}%`, '#c8a96e');
    }
  }, (err) => {
    loading.classList.add('hidden');
    dropOverlay.classList.remove('hidden');
    setStatus('❌ Erreur: ' + err.message, '#e55');
    console.error(err);
  });
}

function setupAnimButtons() {
  const btns = document.getElementById('anim-btns');
  btns.innerHTML = '';
  animations.forEach((anim, i) => {
    const btn = document.createElement('button');
    btn.className = 'anim-btn' + (i === 0 ? ' active' : '');
    btn.textContent = anim.name || `Anim ${i}`;
    btn.onclick = () => {
      mixer.stopAllAction();
      const action = mixer.clipAction(anim);
      action.play();
      document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    btns.appendChild(btn);
  });
  document.getElementById('anim-controls').style.display = 'block';
}

// --- Demo cube (tant que pas de GLB) ---
function loadDefault() {
  clearModel();
  dropOverlay.classList.add('hidden');

  // Demo: gnome placeholder avec geometries WoW-style
  const group = new THREE.Group();

  // Corps
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9040c0, roughness: 0.6, metalness: 0.2 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.4, 8, 16), bodyMat);
  body.position.y = 0.7;
  group.add(body);

  // Tête
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.8 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), headMat);
  head.position.y = 1.3;
  group.add(head);

  // Cheveux
  const hairMat = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 1 });
  const hair = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 8), hairMat);
  hair.position.set(0, 1.55, 0);
  group.add(hair);

  // Bras
  const armMat = new THREE.MeshStandardMaterial({ color: 0x8030b0, roughness: 0.6, metalness: 0.2 });
  [-0.28, 0.28].forEach(x => {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.35, 4, 8), armMat);
    arm.position.set(x, 0.75, 0);
    arm.rotation.z = x > 0 ? -0.3 : 0.3;
    group.add(arm);
  });

  // Jambes
  [-0.1, 0.1].forEach(x => {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.35, 4, 8), armMat);
    leg.position.set(x, 0.25, 0);
    group.add(leg);
  });

  // Botte
  const bootMat = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.9 });
  [-0.1, 0.1].forEach(x => {
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 0.2), bootMat);
    boot.position.set(x, 0.04, 0.02);
    group.add(boot);
  });

  // Bâton magique
  const staffMat = new THREE.MeshStandardMaterial({ color: 0x8060a0, roughness: 0.5 });
  const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 8), staffMat);
  staff.position.set(0.35, 0.8, 0);
  staff.rotation.z = -0.2;
  group.add(staff);

  // Orbe magique
  const orbMat = new THREE.MeshStandardMaterial({ color: 0x4040ff, emissive: 0x2020aa, emissiveIntensity: 2, transparent: true, opacity: 0.8 });
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), orbMat);
  orb.position.set(0.42, 1.5, 0);
  group.add(orb);

  // Ombre
  group.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });

  currentModel = group;
  scene.add(group);
  controls.target.set(0, 0.9, 0);
  camera.position.set(0, 1.4, 2.5);
  controls.update();
  setStatus('🧙 Placeholder gnome mage (importe un .glb pour le vrai perso)', '#c8a96e');
}

// Reset camera
window.resetCamera = function() {
  if (currentModel) {
    const box = new THREE.Box3().setFromObject(currentModel);
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.set(center.x, center.y + 0.5, center.z + 2.5);
  } else {
    controls.target.set(0, 1, 0);
    camera.position.set(0, 1.5, 3);
  }
  controls.update();
};

// Toggle rotation
window.toggleRotate = function() {
  autoRotate = !autoRotate;
  document.getElementById('rotate-btn').textContent = autoRotate ? '⏸ Stop rotation' : '▶ Start rotation';
};

// Drag & Drop
wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.style.borderColor = '#c8a96e'; });
wrap.addEventListener('dragleave', () => { wrap.style.borderColor = '#3a3a5a'; });
wrap.addEventListener('drop', e => {
  e.preventDefault();
  wrap.style.borderColor = '#3a3a5a';
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// File input
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.name.match(/\.(glb|gltf)$/i)) {
    setStatus('❌ Fichier invalide — utilise .glb ou .gltf', '#e55');
    return;
  }
  const url = URL.createObjectURL(file);
  loadGLTF(url, file.name);
}

// Auto-load si /wow-assets/character/krapule.glb existe
fetch('/wow-assets/character/krapule.glb', { method: 'HEAD' })
  .then(r => { if (r.ok) loadGLTF('/wow-assets/character/krapule.glb', 'Krapule'); })
  .catch(() => {});

// Render loop
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  if (autoRotate && currentModel) currentModel.rotation.y += delta * 0.5;
  controls.update();
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Start with demo
loadDefault();
animate();

window.loadDefault = loadDefault;
</script>
</body>
</html>
